[project]
name = "daxquant"
version = "1.0.0"
description = "Point-in-time factor research on DAX constituents, benchmarked against the DAX and the S&P 500"
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "yfinance>=1.7.0",
]

[project.scripts]
daxquant = "daxquant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daxquant"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# The compiled fontTools wheel is blocked by Windows Smart App Control on some
# machines; the pure-Python build behaves identically.
no-binary-package = ["fonttools"]
